        <p><strong>مؤسس الشركة:</strong> المهندس سجاد عبد الحميد مجيد (خريج جامعة الكوفة)</p>
        <p><strong>الخبرة:</strong> أكثر من 7 سنوات من الخبرة الهندسية الميدانية والتصميمية وإنجاز ما يزيد عن 200 مشروع معماري وسكني وتجاري.</p>

      <main style="max-width:900px;margin:0 auto;padding:20px;font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl;text-align:right;line-height:1.8;">
        <h2>خدمات شركة TeBIM الهندسية</h2>
        <ul>
          <li><strong>التصميم المعماري المتقدم (BIM):</strong> تصميم مباني سكنية، فلل فاخرة، مجمعات ومكاتب تجارية، مزارع نموذجية ومطاعم باستخدام Autodesk Revit و Grasshopper للتصميم البارامتري.</li>
          <li><strong>التصميم الداخلي والديكور:</strong> باقات مدروسة (Basic، Smart/Choice، Royal VIP) تتضمن التصميم ثلاثي الأبعاد واختيار المواد وتوزيع الإنارة والمفروشات.</li>
          <li><strong>المخططات التنفيذية الكهروميكانيكية (MEP):</strong> مخططات دقيقة للتمديدات الصحية، المنظومات الكهربائية، تكييف السبلت، ومنظومات الطاقة الشمسية.</li>
          <li><strong>الإشراف الهندسي الميداني:</strong> متابعة يومية وميدانية للتنفيذ، ضمان مطابقة المواصفات الهندسية، وتقديم تقارير دورية ومصورة للعملاء.</li>
          <li><strong>التنفيذ الهندسي المتكامل:</strong> تنفيذ بأعلى معايير الدقة بمواد محددة بالاسم وعقود رسمية تضمن حقوق العميل.</li>
        </ul>

        <h2>أبرز مشاريعنا</h2>
        <p>نفذنا وأشرفنا على أكثر من 200 مشروع، من بينها: الإشراف على فندق 5 نجوم ودار ضيافة للمؤتمرات السياسية (مدينة المعالي - 6 طوابق)، تصميم وإشراف المرحلة الأولى لمشروع مزرعة نموذجية بمساحة 10,000 دونم (وادي الخير)، الإشراف على إنشاء مكاتب شركة أم قصر لصناعة الأسمنت، وتصميم عشرات الفلل السكنية والمنازل الحديثة والمحال التجارية والعيادات الطبية في النجف وكربلاء وبغداد.</p>
