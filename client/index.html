    <!--app-head-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Enable entrance reveals before first paint (avoids a visible→hidden flicker).
      // If the app bundle never boots, the class is removed so content is never stuck hidden.
      (function () {
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var root = document.documentElement;
        root.classList.add("tb-js");
        setTimeout(function () { if (!window.__tbReady) root.classList.remove("tb-js"); }, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics -->

  </body>
</html>
